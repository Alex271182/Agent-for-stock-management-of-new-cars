name: Daily Stock Parse

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Что запустить'
        required: true
        default: 'all'
        type: choice
        options: [all, parsers, validator]

jobs:
  parsers:
    name: Run all parsers
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'parsers'))
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PERXIS_API_KEY: ${{ secrets.PERXIS_API_KEY }}
      GAC_TOKEN: ${{ secrets.GAC_TOKEN }}
      GAC_TOKEN_PRODUCT: ${{ secrets.GAC_TOKEN_PRODUCT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Jetour
        id: jetour
        continue-on-error: true
        run: python jetour_stock_extractor.py

      - name: Changan + Uni
        id: changan_uni
        continue-on-error: true
        run: python changan_uni_stock_extractor.py

      - name: GAC
        id: gac
        continue-on-error: true
        run: python gac_stock_extractor.py

      - name: Perxis (Haval/Geely/Belgee/Tank/Wey)
        id: perxis
        continue-on-error: true
        run: python perxis_playwright_extractor.py

      - name: Summary
        if: always()
        run: |
          echo "Jetour:  ${{ steps.jetour.outcome }}"
          echo "Changan: ${{ steps.changan_uni.outcome }}"
          echo "GAC:     ${{ steps.gac.outcome }}"
          echo "Perxis:  ${{ steps.perxis.outcome }}"

  validator:
    name: Run data quality validator
    runs-on: ubuntu-latest
    needs: parsers
    if: |
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'validator'))
      )
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install requests python-dotenv supabase
      - run: python validator.py

    
